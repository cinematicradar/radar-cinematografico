name: Radar Cinematografico

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:

jobs:
  executar-radar:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: |
          pip install feedparser
          pip install pandas
pip install reportlab
      - name: Rodar agente
        run: |
          python radar.py
      - name: Salvar resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados-radar
          path: resultados/
