name: Radar Cinematografico

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:

jobs:
  executar-radar:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: |
          pip install feedparser
          pip install pandas
          pip install reportlab
          pip install requests

      - name: Rodar agente
        run: |
          python radar.py

      - name: Enviar resultados para Google Sheets
        env:
          RADAR_WEBHOOK_URL: ${{ secrets.RADAR_WEBHOOK_URL }}
          RADAR_TOKEN: ${{ secrets.RADAR_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python enviar_sheets.py

      - name: Salvar resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados-radar
          path: resultados/
